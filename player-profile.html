<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Player Profile - Kabaru Ward Football</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green-dark: #04351f;
    --green: #075b35;
    --green-light: #0b7545;
    --gold: #f5c542;
    --gold-light: #ffe082;
    --background: #f4f7f5;
    --text: #17221c;
    --muted: #66736b;
    --white: #ffffff;
    --border: #e2e9e4;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.6;
}

/* ================================
   HEADER
================================ */

header {
    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);

    position: sticky;
    top: 0;
    z-index: 50;
}

.navbar {
    max-width: 1150px;
    margin: auto;

    padding: 14px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
}

.logo span {
    color: var(--gold);
}

.back-link {
    color: white;
    text-decoration: none;

    font-weight: 800;

    padding: 9px 14px;

    border:
        1px solid rgba(255,255,255,.25);

    border-radius: 10px;

    transition: .2s;
}

.back-link:hover {
    color: var(--gold);
    background: rgba(255,255,255,.1);
}

/* ================================
   CONTAINER
================================ */

.container {
    max-width: 1100px;
    margin: auto;

    padding: 30px 18px 45px;
}

/* ================================
   PLAYER HERO
================================ */

.player-hero {

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at top right,
            rgba(245,197,66,.22),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green-light)
        );

    color: white;

    border-radius: 24px;

    padding: 40px 25px;

    text-align: center;

    margin-bottom: 24px;

    box-shadow:
        0 14px 35px rgba(4,53,31,.2);
}

.player-hero::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    border:
        1px solid rgba(245,197,66,.18);

    border-radius: 50%;

    right: -90px;
    top: -90px;
}

.player-photo {

    position: relative;
    z-index: 2;

    width: 125px;
    height: 125px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold)
        );

    color: var(--green-dark);

    border:
        5px solid rgba(255,255,255,.95);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 46px;
    font-weight: 900;

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.player-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.player-number {

    position: relative;
    z-index: 2;

    display: inline-block;

    background:
        rgba(245,197,66,.16);

    border:
        1px solid rgba(245,197,66,.4);

    color: var(--gold-light);

    padding: 4px 14px;

    border-radius: 999px;

    font-size: 13px;

    font-weight: 900;

    margin-bottom: 9px;
}

.player-hero h1 {

    position: relative;
    z-index: 2;

    font-size:
        clamp(30px, 7vw, 48px);

    line-height: 1.1;

    margin-bottom: 8px;
}

.player-position {

    position: relative;
    z-index: 2;

    font-size: 15px;

    opacity: .9;

    margin-bottom: 5px;
}

.player-team {

    position: relative;
    z-index: 2;

    color: var(--gold-light);

    font-weight: 800;

    font-size: 15px;
}

/* ================================
   SECTIONS
================================ */

.section {

    background: var(--white);

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 22px;

    border:
        1px solid var(--border);

    box-shadow:
        0 5px 18px rgba(0,0,0,.05);
}

.section-heading {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 20px;
}

.section-icon {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    background: #e8f4ed;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.section-kicker {

    color: var(--green-light);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    font-weight: 900;
}

.section h2 {

    color: var(--green-dark);

    font-size: 22px;
}

/* ================================
   PLAYER INFORMATION
================================ */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(210px, 1fr)
        );

    gap: 13px;
}

.info-card {

    background:
        linear-gradient(
            145deg,
            #f8faf9,
            #f1f5f2
        );

    border:
        1px solid var(--border);

    border-radius: 13px;

    padding: 16px;
}

.info-card strong {

    display: block;

    color: var(--green);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .5px;

    margin-bottom: 5px;
}

/* ================================
   STATISTICS
================================ */

.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(135px, 1fr)
        );

    gap: 13px;
}

.stat-card {

    background:
        linear-gradient(
            145deg,
            #f8faf9,
            #eef5f1
        );

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 20px 10px;

    text-align: center;
}

.stat-card strong {

    display: block;

    color: var(--green-dark);

    font-size: 30px;

    line-height: 1.1;

    margin-bottom: 6px;
}

.stat-card span {

    color: var(--muted);

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;
}

/* ================================
   PERFORMANCE BANNER
================================ */

.performance {

    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    border-radius: 16px;

    padding: 22px;

    text-align: center;

    margin-top: 18px;
}

.performance h3 {

    color: var(--gold);

    margin-bottom: 4px;
}

.performance p {

    font-size: 13px;

    opacity: .85;
}

/* ================================
   MATCH HISTORY
================================ */

.history-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.history-table {

    width: 100%;

    min-width: 760px;

    border-collapse: collapse;

    font-size: 13px;
}

.history-table th {

    background: var(--green-dark);

    color: white;

    padding: 13px 10px;

    text-align: left;

    white-space: nowrap;
}

.history-table th:first-child {
    border-radius: 10px 0 0 0;
}

.history-table th:last-child {
    border-radius: 0 10px 0 0;
}

.history-table td {

    padding: 14px 10px;

    border-bottom:
        1px solid var(--border);

    vertical-align: middle;
}

.history-table tbody tr:hover {
    background: #f6faf7;
}

.matchday {

    display: inline-block;

    background: #e8f4ed;

    color: var(--green);

    padding: 4px 8px;

    border-radius: 999px;

    font-size: 10px;

    font-weight: 900;

    white-space: nowrap;
}

.match-date {

    color: var(--muted);

    font-size: 12px;

    white-space: nowrap;
}

.opponent {

    font-weight: 900;

    color: var(--green-dark);
}

.venue-side {

    color: var(--muted);

    font-size: 11px;
}

.result-score {

    display: inline-block;

    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    padding: 5px 10px;

    border-radius: 8px;

    font-weight: 900;

    white-space: nowrap;
}

.stat-number {
    text-align: center;
    font-weight: 900;
}

.card-yellow {
    color: #a87900;
}

.card-red {
    color: #b3261e;
}

.no-history {

    background:
        linear-gradient(
            145deg,
            #f8faf9,
            #f1f5f2
        );

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 30px 20px;

    text-align: center;

    color: var(--muted);
}

.no-history strong {

    display: block;

    color: var(--green-dark);

    font-size: 18px;

    margin-bottom: 5px;
}

/* ================================
   BUTTONS
================================ */

.buttons {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 25px;
}

.button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    padding: 12px 20px;

    border-radius: 11px;

    text-decoration: none;

    font-weight: 800;

    box-shadow:
        0 5px 12px rgba(4,53,31,.18);

    transition: .2s;
}

.button:hover {

    transform: translateY(-2px);
}

/* ================================
   LOADING / ERROR
================================ */

.loading {

    background: white;

    border-radius: 18px;

    text-align: center;

    padding: 70px 20px;
}

.loading h2 {

    color: var(--green-dark);

    margin-bottom: 8px;
}

.loading p {

    color: var(--muted);
}

.error {

    background: #fff0f0;

    border:
        1px solid #edbcbc;

    color: #8b2222;

    border-radius: 15px;

    padding: 25px;

    text-align: center;
}

/* ================================
   FOOTER
================================ */

footer {

    background:
        linear-gradient(
            135deg,
            #031d12,
            #062719
        );

    color: white;

    text-align: center;

    padding: 30px 18px;
}

footer span {

    color: var(--gold);
}

footer p:last-child {

    color: rgba(255,255,255,.7);

    font-size: 13px;

    margin-top: 4px;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

    .navbar {
        padding: 12px 14px;
    }

    .logo {
        font-size: 17px;
    }

    .back-link {
        font-size: 12px;
        padding: 8px 11px;
    }

    .container {
        padding:
            20px 11px 35px;
    }

    .player-hero {
        padding:
            34px 17px 30px;

        border-radius: 20px;
    }

    .player-photo {
        width: 105px;
        height: 105px;
        font-size: 38px;
    }

    .player-hero h1 {
        font-size: 31px;
    }

    .section {
        padding: 18px;
        border-radius: 15px;
    }

    .section h2 {
        font-size: 19px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media (max-width: 430px) {

    .logo {
        font-size: 15px;
    }

    .back-link {
        font-size: 11px;
    }

    .player-hero h1 {
        font-size: 27px;
    }

}

</style>

</head>

<body>

<header>

<div class="navbar">

```
<div class="logo">
    KABARU <span>⚽</span> FOOTBALL
</div>

<a
    href="index.html#teams"
    class="back-link"
>
    ← Teams
</a>
```

</div>

</header>

<main>

<div class="container">

```
<div id="playerContent">

    <div class="loading">

        <h2>
            ⚽ Loading Player Profile...
        </h2>

        <p>
            Please wait while we load
            the player information.
        </p>

    </div>

</div>
```

</div>

</main>

<footer>

<p>
    © 2026
    <span>Kabaru Ward Football</span>
</p>

<p>
    Football • Community • Talent • Development
</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const playerContent =
            document.getElementById(
                "playerContent"
            );

        const params =
            new URLSearchParams(
                window.location.search
            );

        const playerId =
            params.get("id");


        /* ==========================
           CHECK PLAYER ID
        ========================== */

        if (!playerId) {

            showError(
                "No player was selected."
            );

            return;

        }


        try {

            /* ==========================
               LOAD PLAYER
            ========================== */

            const {
                data: player,
                error: playerError
            } = await supabaseClient

                .from("players")

                .select(`
                    id,
                    team_id,
                    full_name,
                    jersey_number,
                    position,
                    photo_url,
                    registration_status,

                    teams (
                        id,
                        name,
                        short_name
                    )
                `)

                .eq("id", playerId)

                .eq(
                    "registration_status",
                    "Approved"
                )

                .single();


            if (playerError) {

                throw playerError;

            }


            if (!player) {

                throw new Error(
                    "Player not found."
                );

            }


            /* ==========================
               LOAD PLAYER STATISTICS
            ========================== */

            const {
                data: stats,
                error: statsError
            } = await supabaseClient

                .from("player_match_stats")

                .select(`
                    result_id,
                    appearances,
                    goals,
                    assists,
                    yellow_cards,
                    red_cards
                `)

                .eq(
                    "player_id",
                    player.id
                );


            if (statsError) {

                throw statsError;

            }


            const playerStats =
                stats || [];


            /* ==========================
               CALCULATE TOTALS
            ========================== */

            let appearances = 0;
            let goals = 0;
            let assists = 0;
            let yellowCards = 0;
            let redCards = 0;


            playerStats.forEach(stat => {

                appearances +=
                    Number(
                        stat.appearances || 0
                    );

                goals +=
                    Number(
                        stat.goals || 0
                    );

                assists +=
                    Number(
                        stat.assists || 0
                    );

                yellowCards +=
                    Number(
                        stat.yellow_cards || 0
                    );

                redCards +=
                    Number(
                        stat.red_cards || 0
                    );

            });


            /* ==========================
               LOAD MATCH RESULTS
            ========================== */

            let matchHistory = [];


            const resultIds =
                playerStats
                    .map(stat => stat.result_id)
                    .filter(Boolean);


            if (resultIds.length > 0) {

                const {
                    data: results,
                    error: resultsError
                } = await supabaseClient

                    .from("results")

                    .select(`
                        id,
                        fixture_id,
                        home_score,
                        away_score,
                        fixtures (
                            id,
                            competition_id,
                            home_team_id,
                            away_team_id,
                            match_date,
                            kick_off,
                            venue,
                            matchday,
                            status,

                            competitions (
                                id,
                                name,
                                season
                            ),

                            home_team:teams!fixtures_home_team_id_fkey (
                                id,
                                name,
                                short_name
                            ),

                            away_team:teams!fixtures_away_team_id_fkey (
                                id,
                                name,
                                short_name
                            )
                        )
                    `)

                    .in(
                        "id",
                        resultIds
                    );


                if (resultsError) {

                    console.error(
                        "MATCH HISTORY ERROR:",
                        resultsError
                    );

                } else {

                    const statsMap =
                        new Map();

                    playerStats.forEach(stat => {

                        statsMap.set(
                            String(stat.result_id),
                            stat
                        );

                    });


                    matchHistory =
                        (results || [])
                            .map(result => {

                                const stat =
                                    statsMap.get(
                                        String(result.id)
                                    );

                                const fixture =
                                    result.fixtures;

                                if (!fixture) {
                                    return null;
                                }


                                const isHome =
                                    Number(
                                        fixture.home_team_id
                                    ) === Number(
                                        player.team_id
                                    );


                                const opponent =
                                    isHome
                                        ? fixture.away_team
                                        : fixture.home_team;


                                return {

                                    result,

                                    fixture,

                                    stat,

                                    opponent,

                                    isHome

                                };

                            })

                            .filter(Boolean)

                            .sort(
                                (a, b) =>
                                    new Date(
                                        b.fixture.match_date
                                    ) -
                                    new Date(
                                        a.fixture.match_date
                                    )
                            );

                }

            }


            /* ==========================
               GOALS PER APPEARANCE
            ========================== */

            const goalsPerAppearance =
                appearances > 0
                    ? (
                        goals /
                        appearances
                    ).toFixed(2)
                    : "0.00";


            /* ==========================
               INITIALS
            ========================== */

            const initials =
                getInitials(
                    player.full_name
                );


            /* ==========================
               TEAM INFORMATION
            ========================== */

            const team =
                player.teams;


            const teamName =
                team?.name ||
                "Kabaru Ward Team";


            /* ==========================
               PAGE TITLE
            ========================== */

            document.title =
                `${player.full_name} - Kabaru Ward Football`;


            /* ==========================
               BUILD MATCH HISTORY
            ========================== */

            let historyHtml = "";


            if (matchHistory.length === 0) {

                historyHtml = `

                    <div class="no-history">

                        <strong>
                            📋 No Match History Yet
                        </strong>

                        <span>
                            This player's recorded
                            match performances will
                            appear here.
                        </span>

                    </div>

                `;

            } else {

                historyHtml = `

                    <div class="history-wrapper">

                        <table class="history-table">

                            <thead>

                                <tr>

                                    <th>
                                        Matchday
                                    </th>

                                    <th>
                                        Date
                                    </th>

                                    <th>
                                        Opponent
                                    </th>

                                    <th>
                                        Venue
                                    </th>

                                    <th>
                                        Result
                                    </th>

                                    <th>
                                        Goals
                                    </th>

                                    <th>
                                        Assists
                                    </th>

                                    <th>
                                        🟨
                                    </th>

                                    <th>
                                        🟥
                                    </th>

                                </tr>

                            </thead>

                            <tbody>

                                ${matchHistory
                                    .map(item => {

                                        const result =
                                            item.result;

                                        const fixture =
                                            item.fixture;

                                        const stat =
                                            item.stat;

                                        const opponent =
                                            item.opponent;


                                        const homeScore =
                                            Number(
                                                result.home_score
                                            );

                                        const awayScore =
                                            Number(
                                                result.away_score
                                            );


                                        const playerScore =
                                            item.isHome
                                                ? homeScore
                                                : awayScore;


                                        const opponentScore =
                                            item.isHome
                                                ? awayScore
                                                : homeScore;


                                        const resultLabel =
                                            playerScore >
                                            opponentScore

                                                ? "W"

                                                : playerScore <
                                                  opponentScore

                                                    ? "L"

                                                    : "D";


                                        const resultClass =
                                            resultLabel;


                                        const date =
                                            formatDate(
                                                fixture.match_date
                                            );


                                        return `

                                            <tr>

                                                <td>

                                                    <span class="matchday">

                                                        ${escapeHtml(
                                                            fixture.matchday ||
                                                            "Match"
                                                        )}

                                                    </span>

                                                </td>


                                                <td>

                                                    <span class="match-date">

                                                        ${date}

                                                    </span>

                                                </td>


                                                <td>

                                                    <div class="opponent">

                                                        ${escapeHtml(
                                                            opponent?.name ||
                                                            "Unknown Team"
                                                        )}

                                                    </div>

                                                    <div class="venue-side">

                                                        ${
                                                            item.isHome
                                                                ? "Home"
                                                                : "Away"
                                                        }

                                                    </div>

                                                </td>


                                                <td>

                                                    ${escapeHtml(
                                                        fixture.venue ||
                                                        "-"
                                                    )}

                                                </td>


                                                <td>

                                                    <span class="result-score">

                                                        ${homeScore}
                                                        -
                                                        ${awayScore}

                                                        &nbsp;

                                                        (${resultClass})

                                                    </span>

                                                </td>


                                                <td class="stat-number">

                                                    ${Number(
                                                        stat?.goals || 0
                                                    )}

                                                </td>


                                                <td class="stat-number">

                                                    ${Number(
                                                        stat?.assists || 0
                                                    )}

                                                </td>


                                                <td class="stat-number card-yellow">

                                                    ${Number(
                                                        stat?.yellow_cards || 0
                                                    )}

                                                </td>


                                                <td class="stat-number card-red">

                                                    ${Number(
                                                        stat?.red_cards || 0
                                                    )}

                                                </td>

                                            </tr>

                                        `;

                                    })
                                    .join("")}

                            </tbody>

                        </table>

                    </div>

                `;

            }


            /* ==========================
               DISPLAY PROFILE
            ========================== */

            playerContent.innerHTML = `

                <!-- PLAYER HERO -->

                <section class="player-hero">

                    <div class="player-photo">

                        ${
                            player.photo_url

                            ? `

                                <img
                                    src="${escapeHtml(
                                        player.photo_url
                                    )}"
                                    alt="${escapeHtml(
                                        player.full_name
                                    )}"
                                >

                            `

                            : initials

                        }

                    </div>


                    <div class="player-number">

                        👕 #

                        ${escapeHtml(
                            player.jersey_number ||
                            "-"
                        )}

                    </div>


                    <h1>

                        ${escapeHtml(
                            player.full_name
                        )}

                    </h1>


                    <div class="player-position">

                        ${
                            escapeHtml(
                                player.position ||
                                "Position not specified"
                            )
                        }

                    </div>


                    <div class="player-team">

                        🏟️
                        ${escapeHtml(
                            teamName
                        )}

                    </div>

                </section>


                <!-- PLAYER INFORMATION -->

                <section class="section">

                    <div class="section-heading">

                        <div class="section-icon">
                            👤
                        </div>

                        <div>

                            <div class="section-kicker">
                                Player Details
                            </div>

                            <h2>
                                Player Information

            `;


        } catch (error) {

            console.error(
                "PLAYER PROFILE ERROR:",
                error
            );


            showError(
                error.message ||
                "Unable to load player profile."
            );

        }


        /* ==========================
           FORMAT DATE
        ========================== */

        function formatDate(value) {

            if (!value) {
                return "-";
            }


            const date =
                new Date(value);


            if (Number.isNaN(
                date.getTime()
            )) {

                return escapeHtml(
                    value
                );

            }


            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* ==========================
           SHOW ERROR
        ========================== */

        function showError(message) {

            playerContent.innerHTML = `

                <div class="error">

                    <h2>
                        ⚠️ Unable to Load Player
                    </h2>

                    <p
                        style="
                            margin-top:8px;
                        "
                    >
                        ${escapeHtml(
                            message
                        )}
                    </p>

                    <div class="buttons">

                        <a
                            href="index.html#teams"
                            class="button"
                        >
                            ← Back to Teams
                        </a>

                    </div>

                </div>

            `;

        }


        /* ==========================
           GET INITIALS
        ========================== */

        function getInitials(name) {

            return String(name)

                .split(/\s+/)

                .filter(Boolean)

                .slice(0, 2)

                .map(
                    word =>
                        word
                            .charAt(0)
                            .toUpperCase()
                )

                .join("");

        }


        /* ==========================
           ESCAPE HTML
        ========================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }

    }

);

</script>
