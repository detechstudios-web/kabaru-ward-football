```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kabaru Ward Football - Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-card label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .login-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .login-btn,
        .reset-btn {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #16803c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn {
            background: #555;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #16803c;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
        }

        .error {
            background: #fde8e8;
            color: #b42318;
        }

        .success {
            background: #e8f7ee;
            color: #166534;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #16803c;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- LOGIN CARD -->

    <div class="login-card" id="loginCard">

        <h1>⚽ Kabaru Ward Football</h1>

        <p class="subtitle">
            Administrator Login
        </p>

        <form id="loginForm">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                value="detechstudios@gmail.com"
                placeholder="Enter admin email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                id="loginBtn"
                class="login-btn">
                🔐 Login
            </button>

        </form>

        <span
            id="forgotPassword"
            class="forgot-link">
            Forgot your password?
        </span>

        <div
            id="errorMessage"
            class="message error">
        </div>

        <div
            id="successMessage"
            class="message success">
        </div>

        <a
            href="index.html"
            class="back-link">
            ← Back to Main Website
        </a>

    </div>


    <!-- PASSWORD RESET CARD -->

    <div class="login-card hidden" id="resetCard">

        <h1>🔑 Reset Password</h1>

        <p class="subtitle">
            Enter your administrator email and we will send you a password reset link.
        </p>

        <form id="resetForm">

            <label for="resetEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="resetEmail"
                value="detechstudios@gmail.com"
                placeholder="Enter admin email"
                required
            >

            <button
                type="submit"
                id="resetBtn"
                class="reset-btn">
                📧 Send Reset Email
            </button>

        </form>

        <div
            id="resetErrorMessage"
            class="message error">
        </div>

        <div
            id="resetSuccessMessage"
            class="message success">
        </div>

        <span
            id="backToLogin"
            class="forgot-link">
            ← Back to Login
        </span>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");

const forgotPassword = document.getElementById("forgotPassword");

const resetCard = document.getElementById("resetCard");
const loginCard = document.getElementById("loginCard");

const resetForm = document.getElementById("resetForm");
const resetBtn = document.getElementById("resetBtn");

const backToLogin = document.getElementById("backToLogin");

const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");

const resetErrorMessage =
    document.getElementById("resetErrorMessage");

const resetSuccessMessage =
    document.getElementById("resetSuccessMessage");


function showLoginError(message) {

    errorMessage.textContent = message;
    errorMessage.style.display = "block";

    successMessage.style.display = "none";
}


function showLoginSuccess(message) {

    successMessage.textContent = message;
    successMessage.style.display = "block";

    errorMessage.style.display = "none";
}


function showResetError(message) {

    resetErrorMessage.textContent = message;
    resetErrorMessage.style.display = "block";

    resetSuccessMessage.style.display = "none";
}


function showResetSuccess(message) {

    resetSuccessMessage.textContent = message;
    resetSuccessMessage.style.display = "block";

    resetErrorMessage.style.display = "none";
}


/* ================================
   LOGIN
================================ */

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    errorMessage.style.display = "none";
    successMessage.style.display = "none";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {
            throw error;
        }


        if (!data.user) {

            throw new Error(
                "Login failed. No user was returned."
            );

        }


        /*
         Check that the authenticated user
         is actually an administrator.
        */

        const { data: adminUser, error: adminError } =
            await supabaseClient
                .from("admin_users")
                .select("user_id, role")
                .eq("user_id", data.user.id)
                .eq("role", "admin")
                .maybeSingle();


        if (adminError) {
            throw adminError;
        }


        if (!adminUser) {

            await supabaseClient.auth.signOut();

            throw new Error(
                "This account is not registered as a Kabaru Ward Football administrator."
            );

        }


        showLoginSuccess(
            "Login successful. Opening administrator dashboard..."
        );


        setTimeout(function() {

            window.location.href = "admin.html";

        }, 800);


    } catch (error) {

        console.error(
            "Admin login error:",
            error
        );


        showLoginError(
            error.message ||
            "Unable to login. Please check your email and password."
        );


        loginBtn.disabled = false;
        loginBtn.textContent = "🔐 Login";

    }

});


/* ================================
   SHOW RESET PASSWORD
================================ */

forgotPassword.addEventListener("click", function() {

    loginCard.classList.add("hidden");

    resetCard.classList.remove("hidden");

    resetErrorMessage.style.display = "none";

    resetSuccessMessage.style.display = "none";

});


/* ================================
   BACK TO LOGIN
================================ */

backToLogin.addEventListener("click", function() {

    resetCard.classList.add("hidden");

    loginCard.classList.remove("hidden");

});


/* ================================
   SEND PASSWORD RESET EMAIL
================================ */

resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("resetEmail").value.trim();


    resetBtn.disabled = true;
    resetBtn.textContent = "Sending...";

    resetErrorMessage.style.display = "none";
    resetSuccessMessage.style.display = "none";


    try {

        /*
         Supabase will send the password
         recovery email to this address.
        */

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        window.location.pathname
                }
            );


        if (error) {
            throw error;
        }


        showResetSuccess(
            "Password reset email sent. Check your email inbox and follow the link to create a new password."
        );


    } catch (error) {

        console.error(
            "Password reset error:",
            error
        );


        showResetError(
            error.message ||
            "Unable to send password reset email."
        );

    }


    resetBtn.disabled = false;
    resetBtn.textContent = "📧 Send Reset Email";

});

</script>

</body>
</html>
