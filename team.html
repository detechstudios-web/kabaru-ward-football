<style>

</style>
</head>

<body>

<header>

    <div class="navbar">

        <div class="logo">
            KABARU <span>⚽</span> FOOTBALL
        </div>

        <a href="index.html#teams" class="back-link">
            ← Teams
        </a>

    </div>

</header>


<main>

    <div class="container">

        <div id="teamContent">

            <div class="loading">

                <h2>⚽ Loading Team Profile...</h2>

                <p>
                    Please wait while we load the team information.
                </p>

            </div>

        </div>

    </div>

</main>


<footer>

    <p>
        © 2026 <span>Kabaru Ward Football</span>
    </p>

    <p>
        Football • Community • Talent • Development
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {

    const teamContent =
        document.getElementById("teamContent");

    const params =
        new URLSearchParams(window.location.search);

    const teamId =
        params.get("id");


    if (!teamId) {

        teamContent.innerHTML = `

            <div class="error">

                <h2>⚠️ Team Not Found</h2>

                <p>
                    No team was selected.
                </p>

                <br>

                <a
                    href="index.html#teams"
                    class="back-button"
                >
                    ← Back to Teams
                </a>

            </div>

        `;

        return;
    }


    try {

        /* =========================
           LOAD TEAM
        ========================= */

        const {
            data: team,
            error: teamError
        } = await supabaseClient

            .from("teams")

            .select(`
                id,
                name,
                short_name,
                logo_url,
                location,
                coach_name,
                captain_name,
                vice_captain_name,
                discipline_master_name,
                registration_status,

                players (
                    id,
                    full_name,
                    jersey_number,
                    position,
                    photo_url,
                    registration_status
                )
            `)

            .eq("id", teamId)

            .eq(
                "registration_status",
                "Approved"
            )

            .single();


        if (teamError) {

            throw teamError;

        }


        if (!team) {

            throw new Error(
                "Team not found."
            );

        }


        /* =========================
           APPROVED PLAYERS
        ========================= */

        const players =
            (team.players || [])

                .filter(player =>
                    player.registration_status ===
                    "Approved"
                )

                .sort((a, b) => {

                    return (
                        Number(
                            a.jersey_number || 999
                        )
                        -
                        Number(
                            b.jersey_number || 999
                        )
                    );

                });


        /* =========================
           LOAD PLAYER STATISTICS
        ========================= */

        let playerStats = [];


        if (players.length > 0) {

            const playerIds =
                players.map(
                    player => player.id
                );


            const {
                data: stats,
                error: statsError
            } = await supabaseClient

                .from("player_match_stats")

                .select(`
                    id,
                    player_id,
                    result_id,
                    goals,
                    assists,
                    yellow_cards,
                    red_cards
                `)

                .in(
                    "player_id",
                    playerIds
                );


            if (statsError) {

                console.error(
                    "PLAYER STATS ERROR:",
                    statsError
                );

            } else {

                playerStats =
                    stats || [];

            }

        }


        /* =========================
           CALCULATE PLAYER TOTALS
        ========================= */

        const totals = {};


        players.forEach(player => {

            totals[player.id] = {

                appearances: 0,

                goals: 0,

                assists: 0,

                yellow: 0,

                red: 0

            };

        });


        playerStats.forEach(stat => {

            if (!totals[stat.player_id]) {
                return;
            }


            /*
             * Every player_match_stats
             * record represents one
             * player appearance/stat line.
             */

            totals[stat.player_id]
                .appearances += 1;


            totals[stat.player_id].goals +=
                Number(
                    stat.goals || 0
                );


            totals[stat.player_id].assists +=
                Number(
                    stat.assists || 0
                );


            totals[stat.player_id].yellow +=
                Number(
                    stat.yellow_cards || 0
                );


            totals[stat.player_id].red +=
                Number(
                    stat.red_cards || 0
                );

        });


        /* =========================
           TEAM TOTALS
        ========================= */

        const teamStats = {

            appearances: 0,

            goals: 0,

            assists: 0,

            yellow: 0,

            red: 0

        };


        Object.values(totals).forEach(stat => {

            teamStats.appearances +=
                stat.appearances;

            teamStats.goals +=
                stat.goals;

            teamStats.assists +=
                stat.assists;

            teamStats.yellow +=
                stat.yellow;

            teamStats.red +=
                stat.red;

        });


        /* =========================
           PAGE TITLE
        ========================= */

        document.title =
            `${team.name} - Kabaru Ward Football`;


        const initials =
            getInitials(team.name);


        /* =========================
           DISPLAY PAGE
        ========================= */

        teamContent.innerHTML = `

            <!-- TEAM HEADER -->

            <section class="team-hero">

                <div class="team-badge">

                    ${
                        team.logo_url

                        ? `

                            <img
                                src="${escapeHtml(team.logo_url)}"
                                alt="${escapeHtml(team.name)} logo"
                                style="
                                    width:100%;
                                    height:100%;
                                    object-fit:cover;
                                "
                            >

                        `

                        : initials

                    }

                </div>


                <h1>
                    ${escapeHtml(team.name)}
                </h1>


                ${
                    team.short_name

                    ? `

                        <p>
                            ${escapeHtml(
                                team.short_name
                            )}
                        </p>

                    `

                    : ""

                }


                <p>
                    📍
                    ${escapeHtml(
                        team.location ||
                        "Kabaru Ward"
                    )}
                </p>

            </section>


            <!-- TEAM INFORMATION -->

            <section class="section">

                <h2>
                    🏟️ Team Information
                </h2>


                <div class="details-grid">


                    <div class="detail">

                        <strong>
                            Team Name
                        </strong>

                        ${escapeHtml(team.name)}

                    </div>


                    <div class="detail">

                        <strong>
                            Short Name
                        </strong>

                        ${escapeHtml(
                            team.short_name ||
                            "Not provided"
                        )}

                    </div>


                    <div class="detail">

                        <strong>
                            📍 Location
                        </strong>

                        ${escapeHtml(
                            team.location ||
                            "Not provided"
                        )}

                    </div>


                    <div class="detail">

                        <strong>
                            👔 Coach
                        </strong>

                        ${escapeHtml(
                            team.coach_name ||
                            "Not provided"
                        )}

                    </div>


                    <div class="detail">

                        <strong>
                            🧑‍✈️ Captain
                        </strong>

                        ${escapeHtml(
                            team.captain_name ||
                            "Not provided"
                        )}

                    </div>


                    <div class="detail">

                        <strong>
                            Vice Captain
                        </strong>

                        ${escapeHtml(
                            team.vice_captain_name ||
                            "Not provided"
                        )}

                    </div>


                    <div class="detail">

                        <strong>
                            Discipline Master
                        </strong>

                        ${escapeHtml(
                            team.discipline_master_name ||
                            "Not provided"
                        )}

                    </div>


                    <div class="detail">

                        <strong>
                            👥 Squad Size
                        </strong>

                        ${players.length}
                        players

                    </div>


                </div>

            </section>


            <!-- TEAM STATISTICS -->

            <section class="section">

                <h2>
                    📊 Team Statistics
                </h2>


                <div class="stats-grid">


                    <div class="stat-card">

                        <strong>
                            ${teamStats.appearances}
                        </strong>

                        <span>
                            Player Appearances
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${teamStats.goals}
                        </strong>

                        <span>
                            Goals
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${teamStats.assists}
                        </strong>

                        <span>
                            Assists
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${teamStats.yellow}
                        </strong>

                        <span>
                            Yellow Cards
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${teamStats.red}
                        </strong>

                        <span>
                            Red Cards
                        </span>

                    </div>


                </div>

            </section>


            <!-- SQUAD -->

            <section class="section">

                <h2>
                    👥 ${escapeHtml(team.name)} Squad
                </h2>


                ${
                    players.length === 0

                    ? `

                        <div class="empty">

                            No approved players
                            registered for this
                            team yet.

                        </div>

                    `

                    : `

                        <div class="squad-wrapper">

                            <table
                                class="squad-table"
                            >

                                <thead>

                                    <tr>

                                        <th>#</th>

                                        <th>
                                            Player
                                        </th>

                                        <th>
                                            Position
                                        </th>

                                        <th>
                                            👕 Appearances
                                        </th>

                                        <th>
                                            ⚽ Goals
                                        </th>

                                        <th>
                                            🎯 Assists
                                        </th>

                                        <th>
                                            🟨
                                        </th>

                                        <th>
                                            🟥
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>

                                    ${players.map(player => {

                                        const stat =
                                            totals[player.id];


                                        return `

                                            <tr>

                                                <td
                                                    class="jersey"
                                                >
                                                    ${escapeHtml(
                                                        player.jersey_number ||
                                                        "-"
                                                    )}
                                                </td>


                                                <td
                                                    class="player-name"
                                                >
                                                    ${escapeHtml(
                                                        player.full_name
                                                    )}
                                                </td>


                                                <td>
                                                    ${escapeHtml(
                                                        player.position ||
                                                        "Not specified"
                                                    )}
                                                </td>


                                                <td
                                                    class="stat-number"
                                                >
                                                    ${stat.appearances}
                                                </td>


                                                <td
                                                    class="stat-number"
                                                >
                                                    ${stat.goals}
                                                </td>


                                                <td
                                                    class="stat-number"
                                                >
                                                    ${stat.assists}
                                                </td>


                                                <td>
                                                    ${stat.yellow}
                                                </td>


                                                <td>
                                                    ${stat.red}
                                                </td>

                                            </tr>

                                        `;

                                    }).join("")}

                                </tbody>

                            </table>

                        </div>

                    `

                }

            </section>


            <!-- SQUAD SUMMARY -->

            <section class="section">

                <h2>
                    👥 Squad Summary
                </h2>


                <div class="stats-grid">


                    <div class="stat-card">

                        <strong>
                            ${players.length}
                        </strong>

                        <span>
                            Players
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${countPosition(
                                players,
                                "Goalkeeper"
                            )}
                        </strong>

                        <span>
                            Goalkeepers
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${countPosition(
                                players,
                                "Defender"
                            )}
                        </strong>

                        <span>
                            Defenders
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${countPosition(
                                players,
                                "Midfielder"
                            )}
                        </strong>

                        <span>
                            Midfielders
                        </span>

                    </div>


                    <div class="stat-card">

                        <strong>
                            ${countPosition(
                                players,
                                "Forward"
                            )}
                        </strong>

                        <span>
                            Forwards
                        </span>

                    </div>


                </div>

            </section>


            <div
                style="
                    text-align:center;
                    margin-top:25px;
                "
            >

                <a
                    href="index.html#teams"
                    class="back-button"
                >
                    ← Back to All Teams
                </a>

            </div>

        `;


    } catch (error) {

        console.error(
            "TEAM PROFILE ERROR:",
            error
        );


        teamContent.innerHTML = `

            <div class="error">

                <h2>
                    ⚠️ Unable to Load Team
                </h2>


                <p>
                    We could not load this
                    team profile.
                </p>


                <p style="margin-top:8px;">

                    Please return to the
                    teams page and try again.

                </p>


                <br>


                <a
                    href="index.html#teams"
                    class="back-button"
                >
                    ← Back to Teams
                </a>

            </div>

        `;

    }


    function countPosition(
        players,
        position
    ) {

        return players.filter(player => {

            return String(
                player.position || ""
            )
            .toLowerCase()
            ===
            position.toLowerCase();

        }).length;

    }


    function getInitials(name) {

        return String(name)

            .split(/\s+/)

            .filter(Boolean)

            .slice(0, 2)

            .map(word =>
                word
                    .charAt(0)
                    .toUpperCase()
            )

            .join("");

    }


    function escapeHtml(value) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }

});

</script>

</body>
</html>
```
