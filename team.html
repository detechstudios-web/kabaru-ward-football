<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Profile - Kabaru Ward Football</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green-dark: #04351f;
    --green: #075b35;
    --green-light: #0b7545;
    --gold: #f5c542;
    --gold-light: #ffe082;
    --cream: #fffaf0;
    --background: #f4f7f5;
    --text: #17221c;
    --muted: #66736b;
    --white: #ffffff;
    --border: #e2e9e4;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.6;
}

/* ================================
   HEADER
================================ */

header {
    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);

    position: sticky;
    top: 0;
    z-index: 50;
}

.navbar {
    max-width: 1150px;
    margin: auto;

    padding:
        14px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: .3px;
}

.logo span {
    color: var(--gold);
}

.back-link {
    color: white;
    text-decoration: none;

    font-weight: 800;

    padding:
        9px 14px;

    border:
        1px solid rgba(255,255,255,.25);

    border-radius: 10px;

    transition: .2s;
}

.back-link:hover {
    background: rgba(255,255,255,.1);
    color: var(--gold);
}

/* ================================
   MAIN CONTAINER
================================ */

.container {
    max-width: 1150px;
    margin: auto;

    padding:
        30px 18px 45px;
}

/* ================================
   TEAM HERO
================================ */

.team-hero {
    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at top right,
            rgba(245,197,66,.22),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green-light)
        );

    color: white;

    border-radius: 24px;

    padding:
        42px 25px 38px;

    text-align: center;

    margin-bottom: 24px;

    box-shadow:
        0 14px 35px rgba(4,53,31,.2);
}

.team-hero::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    border:
        1px solid rgba(245,197,66,.18);

    border-radius: 50%;

    right: -90px;
    top: -90px;
}

.team-hero::after {
    content: "";

    position: absolute;

    width: 160px;
    height: 160px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 50%;

    left: -70px;
    bottom: -80px;
}

.team-badge {
    position: relative;
    z-index: 2;

    width: 110px;
    height: 110px;

    margin:
        0 auto 18px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold)
        );

    color: var(--green-dark);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;
    font-weight: 900;

    overflow: hidden;

    border:
        5px solid rgba(255,255,255,.9);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.team-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.team-hero h1 {
    position: relative;
    z-index: 2;

    font-size:
        clamp(30px, 7vw, 50px);

    line-height: 1.1;

    margin-bottom: 7px;

    letter-spacing: -.8px;
}

.team-short-name {
    position: relative;
    z-index: 2;

    display: inline-block;

    background:
        rgba(245,197,66,.15);

    border:
        1px solid rgba(245,197,66,.35);

    color: var(--gold-light);

    border-radius: 999px;

    padding:
        4px 13px;

    font-size: 13px;
    font-weight: 800;

    margin-bottom: 10px;
}

.team-location {
    position: relative;
    z-index: 2;

    opacity: .9;

    font-size: 15px;
}

/* ================================
   SECTIONS
================================ */

.section {
    background: var(--white);

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 22px;

    border:
        1px solid var(--border);

    box-shadow:
        0 5px 18px rgba(0,0,0,.05);
}

.section-heading {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-bottom: 20px;
}

.section-icon {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    background:
        #e8f4ed;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.section h2 {
    color: var(--green-dark);

    font-size: 22px;

    margin: 0;
}

.section-kicker {
    color: var(--green-light);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    font-weight: 900;

    margin-bottom: 2px;
}

/* ================================
   INFORMATION CARDS
================================ */

.details-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(210px, 1fr)
        );

    gap: 13px;
}

.detail {
    background:
        linear-gradient(
            145deg,
            #f8faf9,
            #f1f5f2
        );

    border:
        1px solid var(--border);

    border-radius: 13px;

    padding: 16px;

    transition: .2s;
}

.detail:hover {
    transform: translateY(-2px);

    box-shadow:
        0 6px 15px rgba(0,0,0,.06);
}

.detail strong {
    display: block;

    color: var(--green);

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: .5px;

    margin-bottom: 5px;
}

/* ================================
   TEAM STATISTICS
================================ */

.stats-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(135px, 1fr)
        );

    gap: 13px;
}

.stat-card {
    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #f8faf9,
            #eef5f1
        );

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding:
        19px 12px;

    text-align: center;
}

.stat-card::after {
    content: "";

    position: absolute;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    border:
        1px solid rgba(7,91,53,.08);

    right: -20px;
    top: -20px;
}

.stat-card strong {
    display: block;

    font-size: 29px;

    line-height: 1.1;

    color: var(--green-dark);

    margin-bottom: 6px;
}

.stat-card span {
    font-size: 11px;

    color: var(--muted);

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .3px;
}

/* ================================
   SQUAD TABLE
================================ */

.squad-wrapper {
    width: 100%;

    overflow-x: auto;

    border:
        1px solid var(--border);

    border-radius: 13px;
}

.squad-table {
    width: 100%;

    min-width: 800px;

    border-collapse: collapse;
}

.squad-table th {
    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    padding:
        13px 10px;

    text-align: left;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: .3px;
}

.squad-table th:first-child {
    border-radius:
        12px 0 0 0;
}

.squad-table th:last-child {
    border-radius:
        0 12px 0 0;
}

.squad-table td {
    padding:
        13px 10px;

    border-bottom:
        1px solid var(--border);

    font-size: 14px;
}

.squad-table tr:last-child td {
    border-bottom: none;
}

.squad-table tbody tr {
    transition: .15s;
}

.squad-table tbody tr:hover {
    background: #f4f8f5;
}

.jersey {
    width: 45px;

    font-weight: 900;

    color: var(--green);

    font-size: 16px;
}

.player-name {
    font-weight: 800;
}

.position-badge {
    display: inline-block;

    padding:
        4px 9px;

    border-radius: 999px;

    background: #edf5f0;

    color: var(--green);

    font-size: 11px;

    font-weight: 800;
}

.stat-number {
    font-weight: 900;

    color: var(--green-dark);
}

/* ================================
   SQUAD SUMMARY
================================ */

.summary-card {
    text-align: center;

    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    border-radius: 16px;

    padding: 25px 18px;

    margin-top: 8px;
}

.summary-card h3 {
    font-size: 17px;

    margin-bottom: 4px;
}

.summary-card p {
    font-size: 13px;

    opacity: .85;
}

/* ================================
   EMPTY / LOADING / ERROR
================================ */

.loading {
    text-align: center;

    padding: 70px 20px;

    background: white;

    border-radius: 18px;
}

.loading h2 {
    color: var(--green-dark);

    margin-bottom: 8px;
}

.loading p {
    color: var(--muted);
}

.error {
    background: #fff0f0;

    border:
        1px solid #edbcbc;

    color: #8b2222;

    border-radius: 15px;

    padding: 25px;

    text-align: center;
}

.empty {
    text-align: center;

    padding: 30px 20px;

    color: var(--muted);

    background: #f7f9f8;

    border-radius: 12px;
}

/* ================================
   BUTTON
================================ */

.back-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    background:
        linear-gradient(
            135deg,
            var(--green-dark),
            var(--green)
        );

    color: white;

    padding:
        12px 20px;

    border-radius: 11px;

    text-decoration: none;

    font-weight: 800;

    box-shadow:
        0 5px 12px rgba(4,53,31,.18);

    transition: .2s;
}

.back-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(4,53,31,.25);
}

/* ================================
   FOOTER
================================ */

footer {
    background:
        linear-gradient(
            135deg,
            #031d12,
            #062719
        );

    color: white;

    text-align: center;

    padding:
        30px 18px;

    margin-top: 15px;
}

footer p:first-child {
    font-weight: 800;

    margin-bottom: 4px;
}

footer span {
    color: var(--gold);
}

footer p:last-child {
    color: rgba(255,255,255,.7);

    font-size: 13px;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

    .navbar {
        padding:
            12px 14px;
    }

    .logo {
        font-size: 17px;
    }

    .back-link {
        font-size: 12px;

        padding:
            8px 11px;
    }

    .container {
        padding:
            20px 11px 35px;
    }

    .team-hero {
        padding:
            34px 17px 30px;

        border-radius: 20px;
    }

    .team-badge {
        width: 95px;
        height: 95px;

        font-size: 35px;
    }

    .team-hero h1 {
        font-size: 31px;
    }

    .section {
        padding: 18px;

        border-radius: 15px;
    }

    .section h2 {
        font-size: 19px;
    }

    .section-icon {
        width: 38px;
        height: 38px;

        font-size: 18px;
    }

    .details-grid {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .stat-card {
        padding:
            16px 8px;
    }

    .stat-card strong {
        font-size: 25px;
    }

}

@media (max-width: 430px) {

    .logo {
        font-size: 15px;
    }

    .back-link {
        font-size: 11px;
    }

    .team-hero h1 {
        font-size: 27px;
    }

    .stats-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .stat-card span {
        font-size: 10px;
    }

}

</style>

</head>

<body>

<header>

```
<div class="navbar">

    <div class="logo">
        KABARU <span>⚽</span> FOOTBALL
    </div>

    <a
        href="index.html#teams"
        class="back-link"
    >
        ← Teams
    </a>

</div>
```

</header>

<main>

```
<div class="container">

    <div id="teamContent">

        <div class="loading">

            <h2>
                ⚽ Loading Team Profile...
            </h2>

            <p>
                Please wait while we load the
                team information.
            </p>

        </div>

    </div>

</div>
```

</main>

<footer>

```
<p>
    © 2026
    <span>Kabaru Ward Football</span>
</p>

<p>
    Football • Community • Talent • Development
</p>
```

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const teamContent =
            document.getElementById(
                "teamContent"
            );

        const params =
            new URLSearchParams(
                window.location.search
            );

        const teamId =
            params.get("id");


        if (!teamId) {

            teamContent.innerHTML = `

                <div class="error">

                    <h2>
                        ⚠️ Team Not Found
                    </h2>

                    <p>
                        No team was selected.
                    </p>

                    <br>

                    <a
                        href="index.html#teams"
                        class="back-button"
                    >
                        ← Back to Teams
                    </a>

                </div>

            `;

            return;
        }


        try {

            /* ==========================
               LOAD TEAM
            ========================== */

            const {
                data: team,
                error: teamError
            } = await supabaseClient

                .from("teams")

                .select(`
                    id,
                    name,
                    short_name,
                    logo_url,
                    location,
                    coach_name,
                    captain_name,
                    vice_captain_name,
                    discipline_master_name,
                    registration_status,

                    players (
                        id,
                        full_name,
                        jersey_number,
                        position,
                        photo_url,
                        registration_status
                    )
                `)

                .eq("id", teamId)

                .eq(
                    "registration_status",
                    "Approved"
                )

                .single();


            if (teamError) {
                throw teamError;
            }


            if (!team) {
                throw new Error(
                    "Team not found."
                );
            }


            /* ==========================
               APPROVED PLAYERS
            ========================== */

            const players =
                (team.players || [])
                    .filter(
                        player =>
                            player.registration_status ===
                            "Approved"
                    )
                    .sort(
                        (a, b) =>
                            Number(
                                a.jersey_number || 999
                            )
                            -
                            Number(
                                b.jersey_number || 999
                            )
                    );


            /* ==========================
               LOAD PLAYER STATS
            ========================== */

            let playerStats = [];


            if (players.length > 0) {

                const playerIds =
                    players.map(
                        player => player.id
                    );


                const {
                    data: stats,
                    error: statsError
                } = await supabaseClient

                    .from(
                        "player_match_stats"
                    )

                    .select(`
                        id,
                        player_id,
                        result_id,
                        appearances,
                        goals,
                        assists,
                        yellow_cards,
                        red_cards
                    `)

                    .in(
                        "player_id",
                        playerIds
                    );


                if (statsError) {

                    console.error(
                        "PLAYER STATS ERROR:",
                        statsError
                    );

                    throw statsError;

                }


                playerStats =
                    stats || [];

            }


            /* ==========================
               CALCULATE TOTALS
            ========================== */

            const totals = {};


            players.forEach(player => {

                totals[player.id] = {

                    appearances: 0,

                    goals: 0,

                    assists: 0,

                    yellow: 0,

                    red: 0

                };

            });


            playerStats.forEach(stat => {

                if (
                    !totals[stat.player_id]
                ) {
                    return;
                }


                totals[
                    stat.player_id
                ].appearances +=
                    Number(
                        stat.appearances || 0
                    );


                totals[
                    stat.player_id
                ].goals +=
                    Number(
                        stat.goals || 0
                    );


                totals[
                    stat.player_id
                ].assists +=
                    Number(
                        stat.assists || 0
                    );


                totals[
                    stat.player_id
                ].yellow +=
                    Number(
                        stat.yellow_cards || 0
                    );


                totals[
                    stat.player_id
                ].red +=
                    Number(
                        stat.red_cards || 0
                    );

            });


            /* ==========================
               TEAM TOTALS
            ========================== */

            const teamStats = {

                appearances: 0,

                goals: 0,

                assists: 0,

                yellow: 0,

                red: 0

            };


            Object.values(totals)
                .forEach(stat => {

                    teamStats.appearances +=
                        stat.appearances;

                    teamStats.goals +=
                        stat.goals;

                    teamStats.assists +=
                        stat.assists;

                    teamStats.yellow +=
                        stat.yellow;

                    teamStats.red +=
                        stat.red;

                });


            /* ==========================
               PAGE TITLE
            ========================== */

            document.title =
                `${team.name} - Kabaru Ward Football`;


            const initials =
                getInitials(team.name);


            /* ==========================
               DISPLAY PAGE
            ========================== */

            teamContent.innerHTML = `

                <!-- TEAM HERO -->

                <section class="team-hero">

                    <div class="team-badge">

                        ${
                            team.logo_url

                            ? `

                                <img
                                    src="${escapeHtml(team.logo_url)}"
                                    alt="${escapeHtml(team.name)} logo"
                                >

                            `

                            : initials

                        }

                    </div>


                    <h1>
                        ${escapeHtml(team.name)}
                    </h1>


                    ${
                        team.short_name

                        ? `

                            <div
                                class="team-short-name"
                            >
                                ${escapeHtml(
                                    team.short_name
                                )}
                            </div>

                        `

                        : ""
                    }


                    <div
                        class="team-location"
                    >
                        📍
                        ${escapeHtml(
                            team.location ||
                            "Kabaru Ward"
                        )}
                    </div>

                </section>


                <!-- TEAM INFORMATION -->

                <section class="section">

                    <div
                        class="section-heading"
                    >

                        <div class="section-icon">
                            🏟️
                        </div>

                        <div>

                            <div
                                class="section-kicker"
                            >
                                Club Details
                            </div>

                            <h2>
                                Team Information
                            </h2>

                        </div>

                    </div>


                    <div class="details-grid">

                        <div class="detail">

                            <strong>
                                Team Name
                            </strong>

                            ${escapeHtml(
                                team.name
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                Short Name
                            </strong>

                            ${escapeHtml(
                                team.short_name ||
                                "Not provided"
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                📍 Location
                            </strong>

                            ${escapeHtml(
                                team.location ||
                                "Not provided"
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                👔 Coach
                            </strong>

                            ${escapeHtml(
                                team.coach_name ||
                                "Not provided"
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                🧑‍✈️ Captain
                            </strong>

                            ${escapeHtml(
                                team.captain_name ||
                                "Not provided"
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                Vice Captain
                            </strong>

                            ${escapeHtml(
                                team.vice_captain_name ||
                                "Not provided"
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                Discipline Master
                            </strong>

                            ${escapeHtml(
                                team.discipline_master_name ||
                                "Not provided"
                            )}

                        </div>


                        <div class="detail">

                            <strong>
                                👥 Squad Size
                            </strong>

                            ${players.length}
                            players

                        </div>

                    </div>

                </section>


                <!-- TEAM STATISTICS -->

                <section class="section">

                    <div
                        class="section-heading"
                    >

                        <div class="section-icon">
                            📊
                        </div>

                        <div>

                            <div
                                class="section-kicker"
                            >
                                Performance
                            </div>

                            <h2>
                                Team Statistics
                            </h2>

                        </div>

                    </div>


                    <div class="stats-grid">

                        <div class="stat-card">

                            <strong>
                                ${teamStats.appearances}
                            </strong>

                            <span>
                                Player Appearances
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${teamStats.goals}
                            </strong>

                            <span>
                                Goals
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${teamStats.assists}
                            </strong>

                            <span>
                                Assists
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${teamStats.yellow}
                            </strong>

                            <span>
                                Yellow Cards
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${teamStats.red}
                            </strong>

                            <span>
                                Red Cards
                            </span>

                        </div>

                    </div>

                </section>


                <!-- SQUAD -->

                <section class="section">

                    <div
                        class="section-heading"
                    >

                        <div class="section-icon">
                            👥
                        </div>

                        <div>

                            <div
                                class="section-kicker"
                            >
                                Players
                            </div>

                            <h2>
                                ${escapeHtml(
                                    team.name
                                )} Squad
                            </h2>

                        </div>

                    </div>


                    ${
                        players.length === 0

                        ? `

                            <div class="empty">

                                No approved players
                                registered for this
                                team yet.

                            </div>

                        `

                        : `

                            <div class="squad-wrapper">

                                <table class="squad-table">

                                    <thead>

                                        <tr>

                                            <th>
                                                #
                                            </th>

                                            <th>
                                                Player
                                            </th>

                                            <th>
                                                Position
                                            </th>

                                            <th>
                                                Appearances
                                            </th>

                                            <th>
                                                Goals
                                            </th>

                                            <th>
                                                Assists
                                            </th>

                                            <th>
                                                🟨
                                            </th>

                                            <th>
                                                🟥
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody>

                                        ${
                                            players
                                                .map(
                                                    player => {

                                                        const stat =
                                                            totals[
                                                                player.id
                                                            ];

                                                        return `

                                                            <tr>

                                                                <td
                                                                    class="jersey"
                                                                >
                                                                    ${escapeHtml(
                                                                        player.jersey_number ||
                                                                        "-"
                                                                    )}
                                                                </td>


                                                                <td
                                                                    class="player-name"
                                                                >
                                                                    ${escapeHtml(
                                                                        player.full_name
                                                                    )}
                                                                </td>


                                                                <td>

                                                                    <span
                                                                        class="position-badge"
                                                                    >
                                                                        ${escapeHtml(
                                                                            player.position ||
                                                                            "Not specified"
                                                                        )}
                                                                    </span>

                                                                </td>


                                                                <td
                                                                    class="stat-number"
                                                                >
                                                                    ${stat.appearances}
                                                                </td>


                                                                <td
                                                                    class="stat-number"
                                                                >
                                                                    ${stat.goals}
                                                                </td>


                                                                <td
                                                                    class="stat-number"
                                                                >
                                                                    ${stat.assists}
                                                                </td>


                                                                <td>
                                                                    ${stat.yellow}
                                                                </td>


                                                                <td>
                                                                    ${stat.red}
                                                                </td>

                                                            </tr>

                                                        `;

                                                    }
                                                )
                                                .join("")
                                        }

                                    </tbody>

                                </table>

                            </div>

                        `
                    }

                </section>


                <!-- SQUAD SUMMARY -->

                <section class="section">

                    <div
                        class="section-heading"
                    >

                        <div class="section-icon">
                            🧩
                        </div>

                        <div>

                            <div
                                class="section-kicker"
                            >
                                Squad Breakdown
                            </div>

                            <h2>
                                Squad Summary
                            </h2>

                        </div>

                    </div>


                    <div class="stats-grid">

                        <div class="stat-card">

                            <strong>
                                ${players.length}
                            </strong>

                            <span>
                                Players
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${countPosition(
                                    players,
                                    "Goalkeeper"
                                )}
                            </strong>

                            <span>
                                Goalkeepers
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${countPosition(
                                    players,
                                    "Defender"
                                )}
                            </strong>

                            <span>
                                Defenders
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${countPosition(
                                    players,
                                    "Midfielder"
                                )}
                            </strong>

                            <span>
                                Midfielders
                            </span>

                        </div>


                        <div class="stat-card">

                            <strong>
                                ${countPosition(
                                    players,
                                    "Forward"
                                )}
                            </strong>

                            <span>
                                Forwards
                            </span>

                        </div>

                    </div>


                    <div class="summary-card">

                        <h3>
                            ⚽ Kabaru Ward Football
                        </h3>

                        <p>
                            Football • Community •
                            Talent • Development
                        </p>

                    </div>

                </section>


                <!-- BACK BUTTON -->

                <div
                    style="
                        text-align:center;
                        margin-top:28px;
                    "
                >

                    <a
                        href="index.html#teams"
                        class="back-button"
                    >
                        ← Back to All Teams
                    </a>

                </div>

            `;


        } catch (error) {

            console.error(
                "TEAM PROFILE ERROR:",
                error
            );


            teamContent.innerHTML = `

                <div class="error">

                    <h2>
                        ⚠️ Unable to Load Team
                    </h2>


                    <p>
                        We could not load this
                        team profile.
                    </p>


                    <p
                        style="
                            margin-top:8px;
                        "
                    >

                        ${escapeHtml(
                            error.message ||
                            "Please try again."
                        )}

                    </p>


                    <br>


                    <a
                        href="index.html#teams"
                        class="back-button"
                    >
                        ← Back to Teams
                    </a>

                </div>

            `;

        }


        /* ==========================
           COUNT POSITIONS
        ========================== */

        function countPosition(
            players,
            position
        ) {

            return players.filter(
                player => {

                    return String(
                        player.position || ""
                    )
                    .toLowerCase()
                    ===
                    position.toLowerCase();

                }
            ).length;

        }


        /* ==========================
           GET INITIALS
        ========================== */

        function getInitials(name) {

            return String(name)

                .split(/\s+/)

                .filter(Boolean)

                .slice(0, 2)

                .map(
                    word =>
                        word
                            .charAt(0)
                            .toUpperCase()
                )

                .join("");

        }


        /* ==========================
           ESCAPE HTML
        ========================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

        }

    }

);

</script>

</body>
</html>
