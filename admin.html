<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kabaru Ward Football - Admin</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-header h1 {
            margin: 0;
        }

        .admin-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .registration-card {
            border-left: 5px solid #f0a500;
        }

        .team-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }

        .detail {
            padding: 10px;
            background: #f7f7f7;
            border-radius: 6px;
        }

        .players-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .players-table th,
        .players-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .players-table th {
            background: #f5f5f5;
        }

        .admin-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
        }

        .approve-btn {
            background: #16803c;
            color: white;
        }

        .reject-btn {
            background: #c62828;
            color: white;
        }

        .logout-btn {
            background: #333;
            color: white;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }

        @media (max-width: 700px) {

            .players-table {
                font-size: 13px;
            }

            .players-table th,
            .players-table td {
                padding: 7px;
            }

            .admin-container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="admin-container">

    <div class="admin-header">

        <div>
            <h1>⚽ Kabaru Ward Football</h1>
            <p>Administrator Dashboard</p>
        </div>

        <button
            id="logoutBtn"
            class="admin-btn logout-btn">
            Logout
        </button>

    </div>


    <div
        id="statusMessage"
        class="status-message">
    </div>


    <div class="admin-card">

        <h2>📋 Pending Team Registrations</h2>

        <p>
            Review teams submitted through the public
            registration form.
        </p>

    </div>


    <div id="pendingTeams">

        <div class="empty-message">
            Loading registrations...
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="admin.js"></script>

</body>
</html>
